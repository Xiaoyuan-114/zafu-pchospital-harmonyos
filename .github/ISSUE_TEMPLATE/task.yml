name: 可验收任务
description: 适合 1–3 人日的课程开发任务
title: "[阶段] 具体用户行为或基础契约"
body:
  - type: textarea
    id: goal
    attributes:
      label: 目标与交付
      description: 谁在什么场景完成什么动作；列出代码、迁移或文档交付物。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与不包含
      description: 明确本 Issue 边界，超出 3 人日继续拆分。
    validations:
      required: true
  - type: textarea
    id: deps
    attributes:
      label: 前置依赖与接口契约
      description: 写 Issue 编号、对象、端点、字段、状态和错误。
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: 角色与数据权限
      description: 本人、工作人员、审核员可见范围及越权失败行为。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收步骤与证据
      description: 角色、设备、数据准备、操作、后端变化、错误/空态；附构建与真机证据位置。
    validations:
      required: true
  - type: checkboxes
    id: done
    attributes:
      label: 完成定义
      options:
        - label: 契约/文档及相关测试更新
        - label: 构建与必要测试结果已附命令和日志
        - label: 真机设备、系统版本、截图/录屏已附；未验证则明确标记
        - label: PR 由另一位成员审核
